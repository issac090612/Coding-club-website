<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register to join the Coding Club.">
  <title>Register — Coding Club</title>
  <script>
    /* Apply saved theme before first paint (no flash). No saved value = follow system. */
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    /* Enable scroll-reveal animations; site.js reveals elements as they scroll in. */
    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('anim-on');
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html">&lt;/&gt; Coding Club</a>
      <div class="nav-links">
        <a href="index.html#showcase">Showcase</a>
        <a href="index.html#meetings">Meetings</a>
        <a href="submit.html">Submit</a>
        <a href="register.html" class="btn btn-primary">Register</a>
        <button class="theme-toggle" aria-label="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.4 13.9A8.6 8.6 0 1 1 10.1 3.6a6.8 6.8 0 0 0 10.3 10.3z"></path>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="auth-wrap container">
    <h1 class="reveal">Join the Coding Club.</h1>
    <p class="page-sub reveal rd1">Register below — and come to our next Saturday meeting.</p>

    <form id="register-form" class="form-card reveal rd2" novalidate>
      <div class="form-row">
        <label for="reg-name">Full name <span class="required">*</span></label>
        <input type="text" id="reg-name" required autocomplete="name" placeholder="Your name">
      </div>

      <div class="form-row">
        <label for="reg-email">Email <span class="muted">(optional)</span></label>
        <input type="email" id="reg-email" autocomplete="email" placeholder="you@example.com">
      </div>

      <div class="form-row">
        <label for="reg-msg">What would you like to make? <span class="muted">(optional)</span></label>
        <textarea id="reg-msg" rows="3" maxlength="500" placeholder="Anything you're excited about building"></textarea>
      </div>

      <div class="form-row checkbox-row">
        <input type="checkbox" id="reg-consent" required>
        <label for="reg-consent">I'd like to join the Coding Club. <span class="required">*</span></label>
      </div>

      <p id="reg-status" class="status" role="status" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary btn-block">Register</button>

      <p class="form-note">This form doesn't send data anywhere yet — connect it to a form backend once the site is hosted.</p>
    </form>
  </main>

  <footer>
    <div class="container foot-inner">
      <p>© <span id="year"></span> Coding Club. Everyone is welcome.</p>
      <p>Saturdays · 7:30–8:00 AM · UTC+8</p>
    </div>
  </footer>

  <script>
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var status = document.getElementById('reg-status');
      var name = document.getElementById('reg-name');
      var email = document.getElementById('reg-email');
      var consent = document.getElementById('reg-consent');
      if (!name.value.trim() || !consent.checked) {
        status.textContent = 'Please fill in the required fields.';
        status.className = 'status error';
        return;
      }
      if (email.value.trim() && !email.checkValidity()) {
        status.textContent = 'Please enter a valid email address, or leave it empty.';
        status.className = 'status error';
        return;
      }
      status.textContent = 'Thanks for registering. See you Saturday.';
      status.className = 'status success';
      this.reset();
    });
  </script>
</body>
</html>
